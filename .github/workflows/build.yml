name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      # Юнит-тесты чистой логики (рецепты, тиры, ночь, настройки) — быстрые и без устройства.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      # Debug APK: проверяет и Kotlin, и натив (CMake/NDK), и упаковку ресурсов.
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thundercam-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
